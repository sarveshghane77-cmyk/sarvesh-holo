<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SARVESH HOLO V4</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#030712;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

.app{
  min-height:100vh;
  padding:16px;
}

header{
  max-width:1000px;
  margin:auto;
  padding:16px 0;
  border-bottom:1px solid #1e293b;
}

.logo{
  font-size:23px;
  font-weight:700;
  letter-spacing:2px;
}

.sub{
  margin-top:5px;
  font-size:12px;
  color:#64748b;
  letter-spacing:1px;
}

.status{
  display:inline-block;
  margin-top:10px;
  padding:6px 10px;
  border:1px solid #334155;
  border-radius:20px;
  font-size:12px;
  color:#94a3b8;
}

.lab{
  max-width:1000px;
  margin:18px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.panel{
  border:1px solid #1e293b;
  border-radius:20px;
  background:#070d18;
  padding:14px;
}

.title{
  font-size:14px;
  font-weight:bold;
  margin-bottom:10px;
  color:#cbd5e1;
}

.camera{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  background:#020617;
  border-radius:14px;
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  display:block;
}

#handCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transform:scaleX(-1);
}

.pointer{
  position:absolute;
  width:20px;
  height:20px;
  border:2px solid #fff;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  display:none;
  z-index:10;
  box-shadow:0 0 15px rgba(255,255,255,.7);
}

.scene{
  position:relative;
  height:100%;
  min-height:300px;
  overflow:hidden;
  border-radius:14px;
  background:
    radial-gradient(
      circle at center,
      rgba(59,130,246,.14),
      transparent 35%
    ),
    #020617;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:900px;
}

.grid{
  position:absolute;
  width:160%;
  height:65%;
  bottom:-18%;
  background:
    linear-gradient(#1e3a5f 1px,transparent 1px),
    linear-gradient(90deg,#1e3a5f 1px,transparent 1px);
  background-size:30px 30px;
  transform:perspective(160px) rotateX(60deg);
  opacity:.35;
}

.holo{
  position:absolute;
  left:50%;
  top:50%;
  width:110px;
  height:110px;

  transform:
    translate(-50%,-50%)
    rotateX(10deg)
    rotateY(25deg);

  transform-style:preserve-3d;

  transition:
    left .08s linear,
    top .08s linear,
    opacity .2s;
}

.face{
  position:absolute;
  width:110px;
  height:110px;

  border:2px solid #60a5fa;

  background:
    rgba(59,130,246,.06);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:10px;
  color:#93c5fd;

  box-shadow:
    0 0 18px rgba(59,130,246,.18);
}

.front{
  transform:translateZ(55px);
}

.back{
  transform:rotateY(180deg) translateZ(55px);
}

.right{
  transform:rotateY(90deg) translateZ(55px);
}

.left{
  transform:rotateY(-90deg) translateZ(55px);
}

.top{
  transform:rotateX(90deg) translateZ(55px);
}

.bottom{
  transform:rotateX(-90deg) translateZ(55px);
}

.controls{
  max-width:1000px;
  margin:0 auto;

  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:1px solid #334155;
  background:#0f172a;
  color:#e2e8f0;
  border-radius:12px;
  padding:13px 18px;
  font-size:14px;
}

button:active{
  transform:scale(.98);
}

.info{
  max-width:1000px;
  margin:14px auto;
  padding:14px;

  border:1px solid #1e293b;
  border-radius:14px;

  background:#070d18;

  color:#94a3b8;
  font-size:13px;
  line-height:1.6;
}

@media(max-width:700px){

  .lab{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
SARVESH HOLO
</div>

<div class="sub">
TOUCHLESS 3D INTERFACE · V4
</div>

<div class="status" id="status">
● SYSTEM READY
</div>

</header>


<div class="lab">

<!-- CAMERA -->

<div class="panel">

<div class="title">
HAND SENSOR
</div>

<div class="camera">

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="handCanvas"></canvas>

<div
id="pointer"
class="pointer">
</div>

</div>

</div>


<!-- HOLOGRAM -->

<div class="panel">

<div class="title">
VIRTUAL HOLOGRAM
</div>

<div
class="scene"
id="scene">

<div class="grid"></div>


<div
class="holo"
id="holo">

<div class="face front">
HOLOGRAM
</div>

<div class="face back">
BACK
</div>

<div class="face right">
RIGHT
</div>

<div class="face left">
LEFT
</div>

<div class="face top">
TOP
</div>

<div class="face bottom">
BOTTOM
</div>

</div>

</div>

</div>

</div>


<div class="controls">

<button id="start">
START CAMERA
</button>

<button id="stop">
STOP CAMERA
</button>

<button id="reset">
RESET
</button>

</div>


<div
class="info"
id="info">

Touchless V4 system ready.<br>
Start the camera and show one hand.

</div>

</div>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>


<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("handCanvas");

const ctx =
canvas.getContext("2d");

const holo =
document.getElementById("holo");

const pointer =
document.getElementById("pointer");

const status =
document.getElementById("status");

const info =
document.getElementById("info");

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");

const resetButton =
document.getElementById("reset");


let stream = null;

let running = false;

let hands = null;


/*
--------------------------------
3D STATE
--------------------------------
*/

let posX = 50;
let posY = 50;

let rotationX = 10;
let rotationY = 25;

let targetX = 50;
let targetY = 50;

let targetRotationX = 10;
let targetRotationY = 25;


/*
--------------------------------
PINCH STATE
--------------------------------
*/

let pinchActive = false;

let grabOffsetX = 0;
let grabOffsetY = 0;


/*
--------------------------------
START CAMERA
--------------------------------
*/

async function startCamera(){

  if(running){
    return;
  }

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera API is not available."
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{
            ideal:640
          },
          height:{
            ideal:480
          }
        },

        audio:false

      });


    video.srcObject =
      stream;

    running = true;


    status.textContent =
      "● STARTING V4";


    info.innerHTML =
      "Camera started.<br>" +
      "Loading touchless 3D control...";


    await video.play();


    setupHands();

    processCamera();

    animateHologram();

  }

  catch(error){

    console.error(error);

    status.textContent =
      "● CAMERA ERROR";

    info.innerHTML =
      "Camera could not start.<br><br>" +
      error.name +
      ": " +
      error.message;

  }

}


/*
--------------------------------
MEDIAPIPE
--------------------------------
*/

function setupHands(){

  if(hands){
    return;
  }


  hands =
    new Hands({

      locateFile:function(file){

        return (
          "https://cdn.jsdelivr.net/npm/" +
          "@mediapipe/hands/" +
          file
        );

      }

    });


  hands.setOptions({

    maxNumHands:1,

    modelComplexity:1,

    minDetectionConfidence:0.6,

    minTrackingConfidence:0.6

  });


  hands.onResults(
    onResults
  );

}


/*
--------------------------------
PROCESS CAMERA
--------------------------------
*/

async function processCamera(){

  if(!running){
    return;
  }


  if(video.readyState >= 2){

    try{

      await hands.send({
        image:video
      });

    }

    catch(error){

      console.error(
        "Tracking error:",
        error
      );

    }

  }


  requestAnimationFrame(
    processCamera
  );

}


/*
--------------------------------
DISTANCE
--------------------------------
*/

function distance(a,b){

  const dx =
    a.x - b.x;

  const dy =
    a.y - b.y;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/*
--------------------------------
HAND RESULTS
--------------------------------
*/

function onResults(results){

  if(!running){
    return;
  }


  const width =
    video.videoWidth || 640;

  const height =
    video.videoHeight || 480;


  canvas.width =
    width;

  canvas.height =
    height;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  /*
  NO HAND
  */

  if(
    !results.multiHandLandmarks ||
    results.multiHandLandmarks.length === 0
  ){

    status.textContent =
      "● CAMERA ACTIVE · SEARCHING";

    info.innerHTML =
      "Camera is working.<br>" +
      "Show one hand clearly.";

    pointer.style.display =
      "none";

    pinchActive = false;

    return;

  }


  /*
  HAND DETECTED
  */

  const landmarks =
    results.multiHandLandmarks[0];


  /*
  DRAW HAND
  */

  drawConnectors(
    ctx,
    landmarks,
    HAND_CONNECTIONS,
    {
      color:"#60a5fa",
      lineWidth:3
    }
  );


  drawLandmarks(
    ctx,
    landmarks,
    {
      color:"#ffffff",
      lineWidth:1,
      radius:4
    }
  );


  /*
  LANDMARKS
  */

  const wrist =
    landmarks[0];

  const thumbTip =
    landmarks[4];

  const indexTip =
    landmarks[8];

  const middleTip =
    landmarks[12];

  const ringTip =
    landmarks[16];

  const pinkyTip =
    landmarks[20];


  /*
  INDEX POSITION
  */

  const x =
    1 - indexTip.x;

  const y =
    indexTip.y;


  /*
  POINTER
  */

  pointer.style.display =
    "block";

  pointer.style.left =
    (x * 100) + "%";

  pointer.style.top =
    (y * 100) + "%";


  /*
  CLAMP
  */

  const handX =
    Math.max(
      10,
      Math.min(
        90,
        x * 100
      )
    );


  const handY =
    Math.max(
      12,
      Math.min(
        88,
        y * 100
      )
    );


  /*
  FINGER STATES
  */

  const palmSize =
    Math.max(
      distance(
        wrist,
        middleTip
      ),
      0.01
    );


  const indexDistance =
    distance(
      indexTip,
      wrist
    ) / palmSize;


  const middleDistance =
    distance(
      middleTip,
      wrist
    ) / palmSize;


  const ringDistance =
    distance(
      ringTip,
      wrist
    ) / palmSize;


  const pinkyDistance =
    distance(
      pinkyTip,
      wrist
    ) / palmSize;


  /*
  PINCH

  Thumb + index finger
  close together.
  */

  const pinchDistance =
    distance(
      thumbTip,
      indexTip
    );


  const isPinching =
    pinchDistance < 0.075;


  /*
  OPEN PALM
  */

  const openPalm =
    indexDistance > 1.25 &&
    middleDistance > 1.25 &&
    ringDistance > 1.15 &&
    pinkyDistance > 1.05;


  /*
  FIST
  */

  const fist =
    indexDistance < 1.15 &&
    middleDistance < 1.15 &&
    ringDistance < 1.15 &&
    pinkyDistance < 1.15;


  /*
  PINCH START
  */

  if(
    isPinching &&
    !pinchActive
  ){

    pinchActive = true;

    grabOffsetX =
      posX - handX;

    grabOffsetY =
      posY - handY;

  }


  /*
  PINCH RELEASE
  */

  if(
    !isPinching &&
    pinchActive
  ){

    pinchActive = false;

  }


  /*
  GRABBING
  */

  if(isPinching){

    targetX =
      handX + grabOffsetX;

    targetY =
      handY + grabOffsetY;


    targetRotationY =
      25 +
      (handX - 50) * 2.5;


    targetRotationX =
      10 +
      (50 - handY) * 1.6;


    status.textContent =
      "● PINCH · HOLOGRAM GRABBED";


    info.innerHTML =
      "🤏 Pinch detected.<br>" +
      "You are grabbing and manipulating the hologram.";

  }


  /*
  OPEN PALM
  */

  else if(openPalm){

    status.textContent =
      "● OPEN PALM · ACTIVE";

    info.innerHTML =
      "✋ Open palm detected.<br>" +
      "Touchless system active.";

    holo.style.opacity =
      "1";

  }


  /*
  FIST
  */

  else if(fist){

    status.textContent =
      "● FIST · STANDBY";

    info.innerHTML =
      "✊ Fist detected.<br>" +
      "Hologram standby mode.";

    holo.style.opacity =
      "0.2";

  }


  /*
  NORMAL HAND
  */

  else{

    status.textContent =
      "● HAND TRACKING";

    info.innerHTML =
      "☝️ Move your index finger.<br>" +
      "Pinch thumb + index to grab the hologram.";

    holo.style.opacity =
      "1";

  }

}


/*
--------------------------------
SMOOTH 3D ANIMATION
--------------------------------
*/

function animateHologram(){

  if(!running){
    return;
  }


  /*
  Smooth position
  */

  posX +=
    (targetX - posX) *
    0.16;


  posY +=
    (targetY - posY) *
    0.16;


  /*
  Smooth rotation
  */

  rotationX +=
    (targetRotationX - rotationX) *
    0.12;


  rotationY +=
    (targetRotationY - rotationY) *
    0.12;


  holo.style.left =
    posX + "%";


  holo.style.top =
    posY + "%";


  holo.style.transform =
    "translate(-50%,-50%) " +
    "rotateX(" +
    rotationX +
    "deg) " +
    "rotateY(" +
    rotationY +
    "deg)";


  requestAnimationFrame(
    animateHologram
  );

}


/*
--------------------------------
STOP
--------------------------------
*/

function stopCamera(){

  running = false;


  if(stream){

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    stream = null;

  }


  video.srcObject =
    null;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  pointer.style.display =
    "none";


  status.textContent =
    "● CAMERA OFF";


  info.innerHTML =
    "Camera stopped.<br>" +
    "Tap START CAMERA to begin.";

}


/*
--------------------------------
RESET
--------------------------------
*/

function resetHologram(){

  posX = 50;
  posY = 50;

  targetX = 50;
  targetY = 50;

  rotationX = 10;
  rotationY = 25;

  targetRotationX = 10;
  targetRotationY = 25;

  pinchActive = false;


  holo.style.opacity =
    "1";


  status.textContent =
    running
      ? "● CAMERA ACTIVE"
      : "● SYSTEM READY";


  info.innerHTML =
    "Hologram reset.<br>" +
    "Ready for touchless control.";

}


/*
--------------------------------
BUTTONS
--------------------------------
*/

startButton.addEventListener(
  "click",
  startCamera
);

stopButton.addEventListener(
  "click",
  stopCamera
);

resetButton.addEventListener(
  "click",
  resetHologram
);

</script>

</body>
</html>
