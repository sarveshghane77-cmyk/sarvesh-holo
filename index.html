<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SARVESH HOLO V7</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040a;
  color:#fff;
  font-family:Arial,sans-serif;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,#10243b 0%,#050b14 45%,#010207 100%);
}

#camera{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  opacity:.18;
}

#canvas{
  position:absolute;
  inset:0;
  pointer-events:none;
}

#holoArea{
  position:absolute;
  inset:0;
  perspective:900px;
  pointer-events:none;
}

.cube{
  position:absolute;
  width:160px;
  height:160px;
  left:50%;
  top:50%;
  transform-style:preserve-3d;
  transform:translate(-50%,-50%);
  transition:none;
  will-change:transform;
}

.face{
  position:absolute;
  width:160px;
  height:160px;
  border:2px solid rgba(0,220,255,.95);
  background:rgba(0,180,255,.055);
  box-shadow:
    inset 0 0 25px rgba(0,220,255,.12),
    0 0 18px rgba(0,220,255,.18);
  backface-visibility:visible;
}

.front  { transform:translateZ(80px); }
.back   { transform:rotateY(180deg) translateZ(80px); }
.right  { transform:rotateY(90deg) translateZ(80px); }
.left   { transform:rotateY(-90deg) translateZ(80px); }
.top    { transform:rotateX(90deg) translateZ(80px); }
.bottom { transform:rotateX(-90deg) translateZ(80px); }

#cube2 .face{
  border-color:rgba(180,80,255,.95);
  box-shadow:
    inset 0 0 25px rgba(180,80,255,.12),
    0 0 18px rgba(180,80,255,.18);
}

#cube2{
  display:none;
}

#hud{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.title{
  font-size:20px;
  font-weight:700;
  letter-spacing:3px;
}

.subtitle{
  margin-top:4px;
  font-size:11px;
  color:#6edfff;
  letter-spacing:2px;
}

#status{
  padding:9px 13px;
  border:1px solid rgba(0,220,255,.35);
  border-radius:12px;
  background:rgba(0,10,20,.55);
  color:#74e8ff;
  font-size:11px;
  letter-spacing:1px;
  text-align:right;
}

#controls{
  position:absolute;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:20;
  display:flex;
  gap:10px;
}

button{
  border:1px solid rgba(0,220,255,.55);
  background:rgba(0,15,25,.78);
  color:#8eeeff;
  padding:11px 16px;
  border-radius:10px;
  font-size:12px;
  letter-spacing:1px;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

#info{
  position:absolute;
  left:50%;
  bottom:75px;
  transform:translateX(-50%);
  z-index:10;
  width:90%;
  text-align:center;
  font-size:11px;
  color:rgba(220,245,255,.7);
  line-height:1.5;
  pointer-events:none;
}

#loading{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#02040a;
  color:#7deaff;
  letter-spacing:3px;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div id="app">

  <video id="camera" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="holoArea">

    <!-- ORIGINAL FULL-SIZE CUBE -->
    <div id="cube1" class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>

    <!-- SECOND CUBE -->
    <div id="cube2" class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>

  </div>

  <div id="hud">
    <div>
      <div class="title">SARVESH HOLO</div>
      <div class="subtitle">TOUCHLESS 3D CONTROL · V7</div>
    </div>

    <div id="status">SYSTEM READY</div>
  </div>

  <div id="info">
    One hand: control the cube · Two hands: nothing changes ·
    Pinch both hands + move apart: split · Bring pinched hands together: merge
  </div>

  <div id="controls">
    <button id="startBtn">START CAMERA</button>
    <button id="stopBtn">STOP CAMERA</button>
    <button id="resetBtn">RESET</button>
  </div>

  <div id="loading">INITIALIZING HOLOGRAM...</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const cube1 = document.getElementById("cube1");
const cube2 = document.getElementById("cube2");

const statusEl = document.getElementById("status");
const loading = document.getElementById("loading");

let cameraStream = null;
let running = false;

let dualMode = false;

const state1 = {
  x:50,
  y:50,
  rx:0,
  ry:0,
  rz:0,
  scale:1
};

const state2 = {
  x:50,
  y:50,
  rx:0,
  ry:0,
  rz:0,
  scale:.5
};

let target1 = {...state1};
let target2 = {...state2};

function lerp(a,b,t){
  return a+(b-a)*t;
}

function smoothState(current,target,s=.28){
  current.x = lerp(current.x,target.x,s);
  current.y = lerp(current.y,target.y,s);
  current.rx = lerp(current.rx,target.rx,s);
  current.ry = lerp(current.ry,target.ry,s);
  current.rz = lerp(current.rz,target.rz,s);
  current.scale = lerp(current.scale,target.scale,s);
}

function applyCube(el,state){
  el.style.transform =
    `translate(-50%,-50%)
     translate(${state.x - 50}vw,${state.y - 50}vh)
     rotateX(${state.rx}deg)
     rotateY(${state.ry}deg)
     rotateZ(${state.rz}deg)
     scale3d(${state.scale},${state.scale},${state.scale})`;
}

function render(){
  smoothState(state1,target1,.30);
  smoothState(state2,target2,.30);

  applyCube(cube1,state1);
  applyCube(cube2,state2);

  requestAnimationFrame(render);
}

render();

function setStatus(text){
  statusEl.textContent = text;
}

function resetCube(){
  dualMode = false;

  cube1.style.display = "block";
  cube2.style.display = "none";

  target1 = {
    x:50,
    y:50,
    rx:0,
    ry:0,
    rz:0,
    scale:1
  };

  target2 = {
    x:50,
    y:50,
    rx:0,
    ry:0,
    rz:0,
    scale:.5
  };

  state1.x=50;
  state1.y=50;
  state1.rx=0;
  state1.ry=0;
  state1.rz=0;
  state1.scale=1;

  setStatus("SYSTEM READY");
}

function splitCubes(handA,handB){

  if(dualMode) return;

  /*
    IMPORTANT V7 FIX:

    The original cube is NOT resized.

    It remains a full-size cube until this exact
    split moment.

    Then it is hidden FIRST.

    Only after that are the two half-size cubes shown.
  */

  cube1.style.display = "none";
  cube2.style.display = "block";

  dualMode = true;

  target1.scale = .5;
  target2.scale = .5;

  target1.x = handA.x;
  target1.y = handA.y;

  target2.x = handB.x;
  target2.y = handB.y;

  target1.rx = handA.pitch;
  target1.ry = handA.yaw;
  target1.rz = handA.roll;

  target2.rx = handB.pitch;
  target2.ry = handB.yaw;
  target2.rz = handB.roll;

  /*
    Instantly synchronize the hidden cube states
    so no tiny single cube can flash on screen.
  */

  state1.x = target1.x;
  state1.y = target1.y;
  state1.rx = target1.rx;
  state1.ry = target1.ry;
  state1.rz = target1.rz;
  state1.scale = .5;

  state2.x = target2.x;
  state2.y = target2.y;
  state2.rx = target2.rx;
  state2.ry = target2.ry;
  state2.rz = target2.rz;
  state2.scale = .5;

  setStatus("HOLOGRAM SPLIT · 2 CUBES");
}

function mergeCubes(){

  if(!dualMode) return;

  /*
    First calculate the final merged position.
  */

  const x = (state1.x + state2.x) / 2;
  const y = (state1.y + state2.y) / 2;

  const rx = (state1.rx + state2.rx) / 2;
  const ry = (state1.ry + state2.ry) / 2;
  const rz = (state1.rz + state2.rz) / 2;

  /*
    Hide the second cube BEFORE showing the
    full-size original cube.
  */

  cube2.style.display = "none";

  target1 = {
    x:x,
    y:y,
    rx:rx,
    ry:ry,
    rz:rz,
    scale:1
  };

  state1.x=x;
  state1.y=y;
  state1.rx=rx;
  state1.ry=ry;
  state1.rz=rz;
  state1.scale=1;

  /*
    Now show exactly one full-size cube.
  */

  cube1.style.display = "block";

  dualMode = false;

  setStatus("HOLOGRAM MERGED · 1 CUBE");
}

function getPalmData(p){

  const wrist = p[0];
  const indexMCP = p[5];
  const middleMCP = p[9];
  const ringMCP = p[13];
  const pinkyMCP = p[17];

  const cx =
    (wrist.x +
     indexMCP.x +
     middleMCP.x +
     ringMCP.x +
     pinkyMCP.x) / 5;

  const cy =
    (wrist.y +
     indexMCP.y +
     middleMCP.y +
     ringMCP.y +
     pinkyMCP.y) / 5;

  const mirrorX = 1-cx;

  const acrossX = pinkyMCP.x-indexMCP.x;
  const acrossY = pinkyMCP.y-indexMCP.y;

  const upX = middleMCP.x-wrist.x;
  const upY = middleMCP.y-wrist.y;

  const normalX =
    acrossY*upX -
    0*upY;

  const normalY =
    0*upX -
    acrossX*upY;

  const normalZ =
    acrossX*upY -
    acrossY*upX;

  const roll =
    Math.atan2(acrossY,acrossX)*180/Math.PI;

  const yaw =
    Math.atan2(normalX,Math.abs(normalZ))*180/Math.PI;

  const pitch =
    Math.atan2(normalY,Math.abs(normalZ))*180/Math.PI;

  const dx = middleMCP.x-wrist.x;
  const dy = middleMCP.y-wrist.y;

  const palmSize =
    Math.sqrt(dx*dx+dy*dy);

  return {
    x:mirrorX*100,
    y:cy*100,
    roll:roll,
    yaw:yaw,
    pitch:pitch,
    palmSize:palmSize
  };
}

function isPinching(p){

  const thumb=p[4];
  const index=p[8];

  const dx=thumb.x-index.x;
  const dy=thumb.y-index.y;

  const distance=Math.sqrt(dx*dx+dy*dy);

  const wrist=p[0];
  const middle=p[9];

  const px=wrist.x-middle.x;
  const py=wrist.y-middle.y;

  const palm=Math.sqrt(px*px+py*py);

  return distance/palm < .48;
}

function distanceBetween(a,b){

  const dx=a.x-b.x;
  const dy=a.y-b.y;

  return Math.sqrt(dx*dx+dy*dy);
}

function updateSingleHand(hand){

  target1.x=hand.x;
  target1.y=hand.y;

  target1.rx=hand.pitch;
  target1.ry=hand.yaw;
  target1.rz=hand.roll;

  target1.scale=1;

  setStatus("ONE HAND · 3D CONTROL");
}

function updateDualHands(a,b){

  const d=distanceBetween(a,b);

  /*
    Not both pinching:
    absolutely nothing happens.
  */

  if(!a.pinching || !b.pinching){

    setStatus("TWO HANDS · WAITING");

    return;
  }

  /*
    Both pinching and hands move apart.
  */

  if(!dualMode && d > .18){

    splitCubes(a,b);
    return;
  }

  /*
    Already split and hands come together.
  */

  if(dualMode && d < .14){

    mergeCubes();
    return;
  }

  /*
    Two independent half-size cubes.
  */

  if(dualMode){

    target1.x=a.x;
    target1.y=a.y;

    target1.rx=a.pitch;
    target1.ry=a.yaw;
    target1.rz=a.roll;

    target1.scale=.5;

    target2.x=b.x;
    target2.y=b.y;

    target2.rx=b.pitch;
    target2.ry=b.yaw;
    target2.rz=b.roll;

    target2.scale=.5;

    setStatus("2 CUBES · HAND LINK ACTIVE");

  }else{

    setStatus("BOTH PINCHING · MOVE APART");
  }
}

const hands = new Hands({
  locateFile:(file)=>{
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});

hands.setOptions({
  maxNumHands:2,
  modelComplexity:1,
  minDetectionConfidence:.6,
  minTrackingConfidence:.6
});

hands.onResults(results=>{

  if(!running) return;

  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const landmarks=results.multiHandLandmarks || [];

  if(landmarks.length===0){

    setStatus("SEARCHING FOR HAND");

    return;
  }

  const detected=[];

  for(let i=0;i<landmarks.length;i++){

    const hand=getPalmData(landmarks[i]);

    hand.pinching=isPinching(landmarks[i]);

    detected.push(hand);
  }

  if(detected.length===1){

    /*
      If we were split and one hand disappears,
      immediately return to one full cube.
    */

    if(dualMode){

      mergeCubes();
    }

    updateSingleHand(detected[0]);

    return;
  }

  if(detected.length>=2){

    updateDualHands(
      detected[0],
      detected[1]
    );
  }
});

async function startCamera(){

  if(running) return;

  try{

    loading.classList.remove("hidden");

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },
        audio:false
      });

    video.srcObject=cameraStream;

    await video.play();

    running=true;

    loading.classList.add("hidden");

    setStatus("CAMERA ONLINE");

    processVideo();

  }catch(error){

    loading.classList.add("hidden");

    setStatus("CAMERA ERROR");

    alert(
      "Camera could not start.\n\n" +
      error.message
    );
  }
}

async function processVideo(){

  if(!running) return;

  if(video.readyState>=2){

    await hands.send({
      image:video
    });
  }

  requestAnimationFrame(processVideo);
}

function stopCamera(){

  running=false;

  if(cameraStream){

    cameraStream.getTracks().forEach(
      track=>track.stop()
    );

    cameraStream=null;
  }

  video.srcObject=null;

  setStatus("CAMERA OFF");
}

document.getElementById("startBtn")
  .addEventListener("click",startCamera);

document.getElementById("stopBtn")
  .addEventListener("click",stopCamera);

document.getElementById("resetBtn")
  .addEventListener("click",resetCube);

window.addEventListener("resize",()=>{
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
});

resetCube();

setTimeout(()=>{
  loading.classList.add("hidden");
},1200);
</script>

</body>
</html>
