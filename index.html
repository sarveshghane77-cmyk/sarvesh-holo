<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SARVESH HOLO V2</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#030712;
color:#fff;
font-family:Arial,sans-serif;
}

.app{
min-height:100vh;
padding:16px;
}

header{
max-width:1000px;
margin:auto;
padding:16px 0;
border-bottom:1px solid #1e293b;
}

.logo{
font-size:23px;
font-weight:700;
letter-spacing:2px;
}

.sub{
margin-top:5px;
font-size:12px;
color:#64748b;
letter-spacing:1px;
}

.status{
display:inline-block;
margin-top:10px;
padding:6px 10px;
border:1px solid #334155;
border-radius:20px;
font-size:12px;
color:#94a3b8;
}

.lab{
max-width:1000px;
margin:18px auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.panel{
border:1px solid #1e293b;
border-radius:20px;
background:#070d18;
padding:14px;
}

.title{
font-size:14px;
font-weight:bold;
margin-bottom:10px;
color:#cbd5e1;
}

.camera{
position:relative;
width:100%;
aspect-ratio:4/3;
background:#020617;
border-radius:14px;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
display:block;
}

canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
transform:scaleX(-1);
}

.scene{
height:100%;
min-height:300px;
position:relative;
overflow:hidden;
border-radius:14px;
background:
radial-gradient(circle at center,rgba(59,130,246,.13),transparent 35%),
#020617;
display:flex;
align-items:center;
justify-content:center;
}

.grid{
position:absolute;
width:160%;
height:65%;
bottom:-18%;
background:
linear-gradient(#1e3a5f 1px,transparent 1px),
linear-gradient(90deg,#1e3a5f 1px,transparent 1px);
background-size:30px 30px;
transform:perspective(160px) rotateX(60deg);
opacity:.35;
}

.holo{
width:110px;
height:110px;
position:relative;
transform-style:preserve-3d;
transition:transform .12s linear;
}

.face{
position:absolute;
width:110px;
height:110px;
border:2px solid #60a5fa;
background:rgba(59,130,246,.06);
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
color:#93c5fd;
box-shadow:0 0 18px rgba(59,130,246,.18);
}

.front{transform:translateZ(55px)}
.back{transform:rotateY(180deg) translateZ(55px)}
.right{transform:rotateY(90deg) translateZ(55px)}
.left{transform:rotateY(-90deg) translateZ(55px)}
.top{transform:rotateX(90deg) translateZ(55px)}
.bottom{transform:rotateX(-90deg) translateZ(55px)}

.controls{
max-width:1000px;
margin:0 auto;
display:flex;
gap:10px;
flex-wrap:wrap;
}

button{
border:1px solid #334155;
background:#0f172a;
color:#e2e8f0;
border-radius:12px;
padding:13px 18px;
font-size:14px;
}

button:active{
transform:scale(.98);
}

.info{
max-width:1000px;
margin:14px auto;
padding:14px;
border:1px solid #1e293b;
border-radius:14px;
background:#070d18;
color:#94a3b8;
font-size:13px;
line-height:1.6;
}

@media(max-width:700px){
.lab{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">SARVESH HOLO</div>
<div class="sub">TOUCHLESS 3D INTERFACE · V2</div>
<div class="status" id="status">● CAMERA OFF</div>
</header>

<div class="lab">

<div class="panel">

<div class="title">HAND SENSOR</div>

<div class="camera">

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

</div>

</div>

<div class="panel">

<div class="title">VIRTUAL HOLOGRAM</div>

<div class="scene">

<div class="grid"></div>

<div class="holo" id="holo">

<div class="face front">HOLOGRAM</div>
<div class="face back">BACK</div>
<div class="face right">RIGHT</div>
<div class="face left">LEFT</div>
<div class="face top">TOP</div>
<div class="face bottom">BOTTOM</div>

</div>

</div>

</div>

</div>

<div class="controls">

<button id="start">START CAMERA</button>
<button id="stop">STOP CAMERA</button>
<button id="reset">RESET</button>

</div>

<div class="info" id="info">
Camera is currently off.<br>
Start the camera to begin the touchless-control experiment.
</div>

</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const start=document.getElementById("start");
const stop=document.getElementById("stop");
const reset=document.getElementById("reset");

const status=document.getElementById("status");
const info=document.getElementById("info");
const holo=document.getElementById("holo");

let stream=null;
let running=false;

async function startCamera(){

try{

stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user",
width:{ideal:640},
height:{ideal:480}
},
audio:false
});

video.srcObject=stream;

running=true;

status.textContent="● CAMERA ACTIVE";

info.innerHTML=
"Camera is active.<br>"+
"Move your hand in front of the camera.<br>"+
"Hand tracking will be added to the next stage.";

resizeCanvas();

}catch(error){

status.textContent="● CAMERA ERROR";

info.innerHTML=
"Camera could not be started.<br>"+
error.name+": "+error.message;

}

}

function stopCamera(){

running=false;

if(stream){

stream.getTracks().forEach(track=>track.stop());

stream=null;

}

video.srcObject=null;

ctx.clearRect(0,0,canvas.width,canvas.height);

status.textContent="● CAMERA OFF";

info.innerHTML=
"Camera stopped.<br>"+
"Tap START CAMERA to begin again.";

}

function resizeCanvas(){

canvas.width=video.videoWidth||640;
canvas.height=video.videoHeight||480;

}

function drawTest(){

if(!running)return;

resizeCanvas();

ctx.clearRect(0,0,canvas.width,canvas.height);

requestAnimationFrame(drawTest);

}

start.addEventListener("click",startCamera);

stop.addEventListener("click",stopCamera);

reset.addEventListener("click",()=>{

holo.style.transform=
"rotateX(10deg) rotateY(25deg)";

info.innerHTML=
"System reset.<br>"+
"Ready for touchless control.";

});

video.addEventListener("loadeddata",()=>{

drawTest();

});

</script>

</body>
</html>
