<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>SARVESH HOLO V10</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040a;
  color:#fff;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#app{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 50%,
      #10243b 0%,
      #050b14 45%,
      #010207 100%
    );
}

/* CAMERA */

#camera{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  transform:scaleX(-1);

  opacity:.18;

  z-index:1;

  pointer-events:none;
}

/* CANVAS */

#canvas{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  z-index:2;

  pointer-events:none;
}

/* HOLOGRAM */

#holoArea{
  position:fixed;
  inset:0;

  z-index:5;

  perspective:900px;

  pointer-events:none;
}

/* CUBE */

.cube{
  position:absolute;

  width:160px;
  height:160px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  transform-style:preserve-3d;

  pointer-events:none;

  will-change:transform;
}

.face{
  position:absolute;

  width:160px;
  height:160px;

  border:2px solid rgba(0,220,255,.95);

  background:rgba(0,180,255,.055);

  box-shadow:
    inset 0 0 25px rgba(0,220,255,.12),
    0 0 18px rgba(0,220,255,.18);

  backface-visibility:visible;
}

.front{
  transform:translateZ(80px);
}

.back{
  transform:rotateY(180deg) translateZ(80px);
}

.right{
  transform:rotateY(90deg) translateZ(80px);
}

.left{
  transform:rotateY(-90deg) translateZ(80px);
}

.top{
  transform:rotateX(90deg) translateZ(80px);
}

.bottom{
  transform:rotateX(-90deg) translateZ(80px);
}

/* SECOND CUBE */

#cube2 .face{
  border-color:rgba(190,90,255,.98);

  background:rgba(160,60,255,.055);

  box-shadow:
    inset 0 0 25px rgba(180,70,255,.12),
    0 0 18px rgba(180,70,255,.22);
}


/* HUD */

#hud{
  position:fixed;

  top:16px;
  left:16px;
  right:16px;

  z-index:100;

  display:flex;

  justify-content:space-between;
  align-items:flex-start;

  pointer-events:none;
}

.title{
  font-size:20px;
  font-weight:700;
  letter-spacing:3px;
}

.subtitle{
  margin-top:4px;

  font-size:10px;

  color:#6edfff;

  letter-spacing:2px;
}

#status{
  padding:9px 12px;

  border:1px solid rgba(0,220,255,.35);

  border-radius:12px;

  background:rgba(0,10,20,.75);

  color:#74e8ff;

  font-size:10px;

  letter-spacing:1px;

  text-align:right;
}


/* SIZE DISPLAY */

#sizeInfo{
  position:fixed;

  top:72px;
  left:50%;

  transform:translateX(-50%);

  z-index:100;

  padding:6px 10px;

  border:1px solid rgba(0,220,255,.2);

  border-radius:9px;

  background:rgba(0,8,16,.55);

  color:rgba(180,240,255,.75);

  font-size:9px;

  letter-spacing:1px;

  pointer-events:none;
}


/* INFO */

#info{
  position:fixed;

  left:50%;
  bottom:82px;

  transform:translateX(-50%);

  width:92%;
  max-width:600px;

  z-index:90;

  text-align:center;

  font-size:10px;

  line-height:1.5;

  color:rgba(220,245,255,.72);

  pointer-events:none;
}


/* BUTTONS */

#controls{
  position:fixed;

  left:50%;
  bottom:16px;

  transform:translateX(-50%);

  z-index:9999;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:8px;

  width:max-content;
  max-width:96vw;

  padding:5px;

  border:1px solid rgba(0,220,255,.25);

  border-radius:15px;

  background:rgba(0,8,16,.92);

  box-shadow:
    0 0 20px rgba(0,180,255,.12);

  pointer-events:auto;

  touch-action:manipulation;
}

#controls button{
  min-width:96px;
  min-height:44px;

  padding:10px 12px;

  border:1px solid rgba(0,220,255,.55);

  border-radius:10px;

  background:rgba(0,18,30,.98);

  color:#8eeeff;

  font-size:10px;

  font-weight:600;

  letter-spacing:1px;

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}

#controls button:active{
  transform:scale(.94);

  background:rgba(0,80,110,.9);
}


/* LOADING */

#loading{
  position:fixed;
  inset:0;

  z-index:20000;

  display:flex;

  justify-content:center;
  align-items:center;

  background:#02040a;

  color:#7deaff;

  font-size:12px;

  letter-spacing:3px;

  pointer-events:none;
}

.hidden{
  display:none!important;
}


/* SMALL PHONES */

@media(max-width:430px){

  .title{
    font-size:16px;
    letter-spacing:2px;
  }

  #status{
    font-size:8px;
    padding:8px;
  }

  #sizeInfo{
    top:64px;
    font-size:8px;
  }

  #controls{
    bottom:12px;
    gap:5px;
  }

  #controls button{
    min-width:88px;
    min-height:44px;
    padding:9px 7px;
    font-size:9px;
  }

  #info{
    bottom:72px;
    font-size:9px;
  }
}
</style>
</head>

<body>

<div id="app">

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>

  <canvas id="canvas"></canvas>


  <div id="holoArea">

    <!-- FIRST CUBE -->

    <div id="cube1" class="cube">

      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>

    </div>


    <!-- SECOND CUBE -->

    <div id="cube2" class="cube">

      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>

    </div>

  </div>


  <!-- HUD -->

  <div id="hud">

    <div>

      <div class="title">
        SARVESH HOLO
      </div>

      <div class="subtitle">
        TOUCHLESS 3D CONTROL · V10
      </div>

    </div>

    <div id="status">
      SYSTEM READY
    </div>

  </div>


  <div id="sizeInfo">
    SIZE CONTROL: PINCH DISTANCE
  </div>


  <div id="info">
    Palm = movement · 🤏 Pinch distance = size ·
    Two pinched hands apart = split ·
    Two pinched hands together = merge
  </div>


  <!-- TOUCH CONTROLS -->

  <div id="controls">

    <button id="startBtn">
      START CAMERA
    </button>

    <button id="stopBtn">
      STOP CAMERA
    </button>

    <button id="resetBtn">
      RESET
    </button>

  </div>


  <div id="loading">
    INITIALIZING HOLOGRAM...
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const cube1 =
  document.getElementById("cube1");

const cube2 =
  document.getElementById("cube2");

const statusEl =
  document.getElementById("status");

const sizeInfo =
  document.getElementById("sizeInfo");

const loading =
  document.getElementById("loading");


/* =====================================================
   CAMERA
===================================================== */

let cameraStream=null;

let running=false;


/* =====================================================
   HOLOGRAM MODE
===================================================== */

let dualMode=false;


/* =====================================================
   CUBE STATES
===================================================== */

const state1={
  x:50,
  y:50,
  rx:0,
  ry:0,
  rz:0,
  scale:1
};

const state2={
  x:50,
  y:50,
  rx:0,
  ry:0,
  rz:0,
  scale:.5
};


let target1={...state1};

let target2={...state2};


/* =====================================================
   SIZE LIMITS
===================================================== */

const MIN_SINGLE_SIZE=.55;

const MAX_SINGLE_SIZE=1.45;

const MIN_SPLIT_SIZE=.25;

const MAX_SPLIT_SIZE=.85;


/* =====================================================
   MATH
===================================================== */

function lerp(a,b,t){

  return a+(b-a)*t;

}


function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


function smoothState(
  current,
  target,
  speed=.30
){

  current.x=
    lerp(
      current.x,
      target.x,
      speed
    );

  current.y=
    lerp(
      current.y,
      target.y,
      speed
    );

  current.rx=
    lerp(
      current.rx,
      target.rx,
      speed
    );

  current.ry=
    lerp(
      current.ry,
      target.ry,
      speed
    );

  current.rz=
    lerp(
      current.rz,
      target.rz,
      speed
    );

  current.scale=
    lerp(
      current.scale,
      target.scale,
      speed
    );

}


/* =====================================================
   RENDER
===================================================== */

function applyCube(
  element,
  state
){

  element.style.transform=
    `
    translate(-50%,-50%)
    translate(
      ${state.x-50}vw,
      ${state.y-50}vh
    )
    rotateX(${state.rx}deg)
    rotateY(${state.ry}deg)
    rotateZ(${state.rz}deg)
    scale3d(
      ${state.scale},
      ${state.scale},
      ${state.scale}
    )
    `;

}


function render(){

  smoothState(
    state1,
    target1,
    .30
  );

  smoothState(
    state2,
    target2,
    .30
  );


  applyCube(
    cube1,
    state1
  );

  applyCube(
    cube2,
    state2
  );


  requestAnimationFrame(
    render
  );

}

render();


/* =====================================================
   STATUS
===================================================== */

function setStatus(text){

  statusEl.textContent=text;

}


/* =====================================================
   SIZE TEXT
===================================================== */

function showSize(singleSize){

  const percent=
    Math.round(
      singleSize*100
    );

  sizeInfo.textContent=
    "SIZE: "+percent+"% · PINCH TO CONTROL";

}


/* =====================================================
   RESET
===================================================== */

function resetCube(){

  dualMode=false;


  cube1.style.display="block";

  cube2.style.display="none";


  target1={
    x:50,
    y:50,
    rx:0,
    ry:0,
    rz:0,
    scale:1
  };


  target2={
    x:50,
    y:50,
    rx:0,
    ry:0,
    rz:0,
    scale:.5
  };


  state1.x=50;
  state1.y=50;
  state1.rx=0;
  state1.ry=0;
  state1.rz=0;
  state1.scale=1;


  state2.x=50;
  state2.y=50;
  state2.rx=0;
  state2.ry=0;
  state2.rz=0;
  state2.scale=.5;


  showSize(1);


  setStatus(
    "SYSTEM READY"
  );

}


/* =====================================================
   PALM DATA
===================================================== */

function getPalmData(p){

  const wrist=p[0];

  const indexMCP=p[5];

  const middleMCP=p[9];

  const ringMCP=p[13];

  const pinkyMCP=p[17];


  const cx=
    (
      wrist.x+
      indexMCP.x+
      middleMCP.x+
      ringMCP.x+
      pinkyMCP.x
    )/5;


  const cy=
    (
      wrist.y+
      indexMCP.y+
      middleMCP.y+
      ringMCP.y+
      pinkyMCP.y
    )/5;


  const x=
    (1-cx)*100;

  const y=
    cy*100;


  const acrossX=
    pinkyMCP.x-
    indexMCP.x;

  const acrossY=
    pinkyMCP.y-
    indexMCP.y;


  const upX=
    middleMCP.x-
    wrist.x;

  const upY=
    middleMCP.y-
    wrist.y;


  const normalX=
    acrossY*upX;

  const normalY=
    -acrossX*upY;

  const normalZ=
    acrossX*upY-
    acrossY*upX;


  const roll=
    Math.atan2(
      acrossY,
      acrossX
    )*180/Math.PI;


  const yaw=
    Math.atan2(
      normalX,
      Math.abs(normalZ)
    )*180/Math.PI;


  const pitch=
    Math.atan2(
      normalY,
      Math.abs(normalZ)
    )*180/Math.PI;


  return{
    x,
    y,
    roll,
    yaw,
    pitch
  };

}


/* =====================================================
   PINCH INFORMATION
===================================================== */

function getPinchData(p){

  const thumb=p[4];

  const index=p[8];


  const dx=
    thumb.x-index.x;

  const dy=
    thumb.y-index.y;


  const distance=
    Math.sqrt(
      dx*dx+
      dy*dy
    );


  const wrist=p[0];

  const middle=p[9];


  const px=
    wrist.x-middle.x;

  const py=
    wrist.y-middle.y;


  const palmSize=
    Math.sqrt(
      px*px+
      py*py
    );


  if(palmSize===0){

    return{
      pinching:false,
      ratio:1,
      size:.5
    };

  }


  /*
    Normalize thumb-index distance
    against the size of the palm.
  */

  const ratio=
    distance/palmSize;


  /*
    Pinch threshold.

    Smaller ratio = fingers closer.

    Larger ratio = fingers farther apart.
  */

  const pinching=
    ratio<.70;


  /*
    Convert finger distance into
    hologram size.

    Closed pinch -> smaller

    Open thumb/index -> larger
  */

  const normalized=
    clamp(
      ratio,
      .18,
      1.15
    );


  const size=
    clamp(
      .35+
      normalized*.85,
      MIN_SPLIT_SIZE,
      MAX_SINGLE_SIZE
    );


  return{
    pinching,
    ratio,
    size
  };

}


/* =====================================================
   HAND DISTANCE
===================================================== */

function handDistance(a,b){

  const dx=
    a.x-b.x;

  const dy=
    a.y-b.y;


  return Math.sqrt(
    dx*dx+
    dy*dy
  )/100;

}


/* =====================================================
   ONE HAND
===================================================== */

function oneHand(hand){

  target1.x=
    hand.x;

  target1.y=
    hand.y;

  target1.rx=
    hand.pitch;

  target1.ry=
    hand.yaw;

  target1.rz=
    hand.roll;


  /*
    Only change size when
    the user is pinching.

    This prevents normal open-palm
    movement from changing size.
  */

  if(hand.pinching){

    target1.scale=
      clamp(
        hand.size,
        MIN_SINGLE_SIZE,
        MAX_SINGLE_SIZE
      );

    showSize(
      target1.scale
    );

    setStatus(
      "ONE HAND · SIZE CONTROL"
    );

  }
  else{

    setStatus(
      "ONE HAND · 3D CONTROL"
    );

  }

}


/* =====================================================
   SPLIT
===================================================== */

function splitCubes(a,b){

  if(dualMode)
    return;


  dualMode=true;


  /*
    BOTH CUBES VISIBLE
  */

  cube1.style.display="block";

  cube2.style.display="block";


  /*
    Start both at half size.

    Each hand gets one cube.
  */

  target1={
    x:a.x,
    y:a.y,

    rx:a.pitch,
    ry:a.yaw,
    rz:a.roll,

    scale:.5
  };


  target2={
    x:b.x,
    y:b.y,

    rx:b.pitch,
    ry:b.yaw,
    rz:b.roll,

    scale:.5
  };


  state1.x=a.x;
  state1.y=a.y;

  state1.rx=a.pitch;
  state1.ry=a.yaw;
  state1.rz=a.roll;

  state1.scale=.5;


  state2.x=b.x;
  state2.y=b.y;

  state2.rx=b.pitch;
  state2.ry=b.yaw;
  state2.rz=b.roll;

  state2.scale=.5;


  setStatus(
    "HOLOGRAM SPLIT · 2 CUBES"
  );

}


/* =====================================================
   MERGE
===================================================== */

function mergeCubes(){

  if(!dualMode)
    return;


  const x=
    (
      state1.x+
      state2.x
    )/2;


  const y=
    (
      state1.y+
      state2.y
    )/2;


  const rx=
    (
      state1.rx+
      state2.rx
    )/2;


  const ry=
    (
      state1.ry+
      state2.ry
    )/2;


  const rz=
    (
      state1.rz+
      state2.rz
    )/2;


  /*
    Purple cube disappears.
  */

  cube2.style.display="none";


  /*
    First cube returns to
    FULL SIZE.
  */

  state1.x=x;
  state1.y=y;

  state1.rx=rx;
  state1.ry=ry;
  state1.rz=rz;

  state1.scale=1;


  target1={
    x:x,
    y:y,

    rx:rx,
    ry:ry,
    rz:rz,

    scale:1
  };


  cube1.style.display="block";


  dualMode=false;


  showSize(1);


  setStatus(
    "HOLOGRAM MERGED · 1 CUBE"
  );

}


/* =====================================================
   TWO HANDS
===================================================== */

function twoHands(a,b){

  const distance=
    handDistance(a,b);


  /*
    If either hand is not pinching,
    nothing changes.

    This preserves your V9 behavior.
  */

  if(
    !a.pinching||
    !b.pinching
  ){

    setStatus(
      "TWO HANDS · WAITING"
    );

    return;

  }


  /*
    BOTH PINCHING + MOVE APART

    Creates two cubes.
  */

  if(
    !dualMode&&
    distance>.18
  ){

    splitCubes(a,b);

    return;

  }


  /*
    BOTH PINCHING + MOVE TOGETHER

    Merges two cubes.
  */

  if(
    dualMode&&
    distance<.14
  ){

    mergeCubes();

    return;

  }


  /*
    TWO CUBE SIZE CONTROL

    Each hand controls
    its own cube.

    Bigger thumb-index gap
    = bigger cube.

    Smaller thumb-index gap
    = smaller cube.
  */

  if(dualMode){

    target1.x=a.x;
    target1.y=a.y;

    target1.rx=a.pitch;
    target1.ry=a.yaw;
    target1.rz=a.roll;


    target2.x=b.x;
    target2.y=b.y;

    target2.rx=b.pitch;
    target2.ry=b.yaw;
    target2.rz=b.roll;


    /*
      Cube 1 size
    */

    target1.scale=
      clamp(
        a.size,
        MIN_SPLIT_SIZE,
        MAX_SPLIT_SIZE
      );


    /*
      Cube 2 size
    */

    target2.scale=
      clamp(
        b.size,
        MIN_SPLIT_SIZE,
        MAX_SPLIT_SIZE
      );


    setStatus(
      "2 CUBES · SIZE CONTROL"
    );


    sizeInfo.textContent=
      "CUBE 1 "+
      Math.round(target1.scale*100)+
      "% · CUBE 2 "+
      Math.round(target2.scale*100)+
      "%";

  }

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands=
  new Hands({

    locateFile:(file)=>{

      return(
        "https://cdn.jsdelivr.net/npm/" +
        "@mediapipe/hands/" +
        file
      );

    }

  });


hands.setOptions({

  maxNumHands:2,

  modelComplexity:1,

  minDetectionConfidence:.6,

  minTrackingConfidence:.6

});


hands.onResults(
  results=>{

    if(!running)
      return;


    const landmarks=
      results.multiHandLandmarks||
      [];


    if(
      landmarks.length===0
    ){

      setStatus(
        "SEARCHING FOR HAND"
      );

      return;

    }


    const detected=[];


    for(
      let i=0;
      i<landmarks.length;
      i++
    ){

      const hand=
        getPalmData(
          landmarks[i]
        );


      const pinch=
        getPinchData(
          landmarks[i]
        );


      hand.pinching=
        pinch.pinching;

      hand.ratio=
        pinch.ratio;

      hand.size=
        pinch.size;


      detected.push(hand);

    }


    /*
      ONE HAND
    */

    if(
      detected.length===1
    ){

      if(dualMode){

        mergeCubes();

      }


      oneHand(
        detected[0]
      );

      return;

    }


    /*
      TWO HANDS
    */

    if(
      detected.length>=2
    ){

      twoHands(
        detected[0],
        detected[1]
      );

    }

  }
);


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  if(running)
    return;


  try{

    loading.classList.remove(
      "hidden"
    );


    cameraStream=
      await navigator
      .mediaDevices
      .getUserMedia({

        video:{
          facingMode:"user",

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }
        },

        audio:false

      });


    video.srcObject=
      cameraStream;


    await video.play();


    running=true;


    loading.classList.add(
      "hidden"
    );


    setStatus(
      "CAMERA ONLINE"
    );


    processVideo();


  }
  catch(error){

    loading.classList.add(
      "hidden"
    );


    setStatus(
      "CAMERA ERROR"
    );


    alert(
      "Camera could not start.\n\n"+
      error.message
    );

  }

}


/* =====================================================
   PROCESS CAMERA
===================================================== */

async function processVideo(){

  if(!running)
    return;


  if(
    video.readyState>=2
  ){

    try{

      await hands.send({
        image:video
      });

    }
    catch(error){

      console.log(
        "Hand tracking error:",
        error
      );

    }

  }


  requestAnimationFrame(
    processVideo
  );

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

  running=false;


  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track=>{
          track.stop();
        }
      );

    cameraStream=null;

  }


  video.srcObject=null;


  setStatus(
    "CAMERA OFF"
  );

}


/* =====================================================
   BUTTONS
===================================================== */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startCamera
  );


document
  .getElementById("stopBtn")
  .addEventListener(
    "click",
    stopCamera
  );


document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    resetCube
  );


/* Android touch support */

document
  .getElementById("startBtn")
  .addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      startCamera();
    },
    {passive:false}
  );


document
  .getElementById("stopBtn")
  .addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      stopCamera();
    },
    {passive:false}
  );


document
  .getElementById("resetBtn")
  .addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      resetCube();
    },
    {passive:false}
  );


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  ()=>{

    canvas.width=
      window.innerWidth;

    canvas.height=
      window.innerHeight;

  }
);


/* =====================================================
   INITIALIZE
===================================================== */

canvas.width=
  window.innerWidth;

canvas.height=
  window.innerHeight;


resetCube();


setTimeout(
  ()=>{
    loading.classList.add(
      "hidden"
    );
  },
  1200
);

</script>
