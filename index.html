<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>SARVESH HOLO — Boss Arena</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  position:relative;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  opacity:.18;
  pointer-events:none;
}

#output{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#space{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 45%,rgba(0,170,255,.12),transparent 28%),
    radial-gradient(circle at 20% 80%,rgba(130,0,255,.12),transparent 25%),
    #02040b;
}

.stars{
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),
    radial-gradient(circle,rgba(0,220,255,.55) 1px,transparent 1px);
  background-size:67px 67px,113px 113px;
  opacity:.25;
  animation:stars 18s linear infinite;
}

@keyframes stars{
  from{transform:translateY(0)}
  to{transform:translateY(67px)}
}

#grid{
  position:absolute;
  left:-20%;
  width:140%;
  height:45%;
  bottom:-18%;
  transform:perspective(500px) rotateX(65deg);
  background:
    linear-gradient(rgba(0,200,255,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,200,255,.16) 1px,transparent 1px);
  background-size:45px 45px;
  opacity:.5;
}

#header{
  position:fixed;
  top:14px;
  left:14px;
  right:14px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.brand{
  letter-spacing:4px;
  font-weight:bold;
  font-size:19px;
  text-shadow:0 0 14px #00d9ff;
}

.sub{
  margin-top:4px;
  font-size:10px;
  letter-spacing:2px;
  opacity:.65;
}

.hud{
  text-align:right;
  font-size:11px;
  line-height:1.8;
  letter-spacing:1px;
}

.hud span{
  color:#5de8ff;
}

#mission{
  position:fixed;
  top:88px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  text-align:center;
  width:min(90%,420px);
  pointer-events:none;
}

.missionTitle{
  font-size:11px;
  letter-spacing:3px;
  color:#7cecff;
}

#bossName{
  margin-top:5px;
  font-size:18px;
  font-weight:bold;
  letter-spacing:3px;
}

#bossBar{
  margin:10px auto 0;
  height:9px;
  width:min(82vw,360px);
  border:1px solid rgba(0,220,255,.6);
  padding:2px;
  background:rgba(0,0,0,.45);
}

#bossHealth{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#00d9ff,#b500ff);
  box-shadow:0 0 12px #00d9ff;
  transition:width .15s linear;
}

#arena{
  position:absolute;
  left:50%;
  top:51%;
  width:min(92vw,560px);
  height:min(65vh,560px);
  transform:translate(-50%,-50%);
  pointer-events:none;
}

#reactor{
  position:absolute;
  left:50%;
  top:50%;
  width:120px;
  height:120px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(0,220,255,.7);
  border-radius:50%;
  box-shadow:
    0 0 20px rgba(0,220,255,.5),
    inset 0 0 30px rgba(0,220,255,.15);
}

#reactor:before,
#reactor:after{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid rgba(150,0,255,.7);
  border-radius:50%;
  animation:spin 5s linear infinite;
}

#reactor:after{
  inset:30px;
  border-color:rgba(0,220,255,.8);
  animation-direction:reverse;
  animation-duration:3s;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#boss{
  position:absolute;
  left:50%;
  top:30%;
  width:150px;
  height:150px;
  transform:translate(-50%,-50%);
  transition:transform .15s linear;
}

.bossCore{
  position:absolute;
  left:50%;
  top:50%;
  width:70px;
  height:70px;
  transform:translate(-50%,-50%) rotate(45deg);
  border:2px solid #c000ff;
  background:rgba(120,0,255,.15);
  box-shadow:
    0 0 15px #b000ff,
    0 0 45px rgba(160,0,255,.7);
}

.bossCore:before,
.bossCore:after{
  content:"";
  position:absolute;
  inset:12px;
  border:1px solid #00eaff;
}

.bossCore:after{
  inset:-18px;
  border-radius:50%;
  border-color:rgba(0,220,255,.7);
  animation:spin 2.5s linear infinite;
}

.wing{
  position:absolute;
  top:50%;
  width:55px;
  height:80px;
  border:2px solid rgba(0,220,255,.7);
  background:rgba(0,160,255,.06);
  transform:translateY(-50%) skewY(-18deg);
}

.wing.left{right:72px}
.wing.right{
  left:72px;
  transform:translateY(-50%) scaleX(-1) skewY(-18deg);
}

#target{
  position:absolute;
  width:58px;
  height:58px;
  border:2px solid #fff;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:
    0 0 10px #fff,
    0 0 30px #00d9ff;
  display:none;
}

#target:before,
#target:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  background:#fff;
  transform:translate(-50%,-50%);
}

#target:before{
  width:78px;
  height:1px;
}

#target:after{
  height:78px;
  width:1px;
}

#cursor{
  position:absolute;
  width:22px;
  height:22px;
  border:2px solid #00eaff;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 16px #00eaff;
  display:none;
}

#cursorPinch{
  position:absolute;
  left:50%;
  top:50%;
  width:5px;
  height:5px;
  transform:translate(-50%,-50%);
  background:#fff;
  border-radius:50%;
}

#beam{
  position:absolute;
  left:50%;
  top:50%;
  width:5px;
  height:0;
  transform-origin:top center;
  background:#fff;
  box-shadow:
    0 0 8px #00eaff,
    0 0 25px #a000ff;
  opacity:0;
}

#beam.active{
  opacity:1;
  height:260px;
  animation:beamPulse .15s infinite alternate;
}

@keyframes beamPulse{
  from{width:4px}
  to{width:9px}
}

#gesture{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%);
  z-index:25;
  min-width:210px;
  padding:8px 14px;
  text-align:center;
  border:1px solid rgba(0,220,255,.4);
  background:rgba(0,10,25,.72);
  backdrop-filter:blur(8px);
  font-size:11px;
  letter-spacing:2px;
}

#controls{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:100;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  width:96%;
  pointer-events:auto;
}

button{
  min-height:44px;
  padding:10px 15px;
  border:1px solid rgba(0,220,255,.55);
  border-radius:9px;
  background:rgba(2,15,30,.88);
  color:#dffaff;
  font-weight:bold;
  font-size:11px;
  letter-spacing:1px;
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.96);
}

button.primary{
  border-color:#00eaff;
  box-shadow:0 0 12px rgba(0,220,255,.3);
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(1,3,10,.92);
  padding:25px;
}

.startCard{
  width:min(92vw,430px);
  padding:30px 22px;
  text-align:center;
  border:1px solid rgba(0,220,255,.45);
  background:rgba(3,12,25,.95);
  box-shadow:0 0 50px rgba(0,170,255,.12);
}

.startCard h1{
  margin:0;
  letter-spacing:6px;
  font-size:27px;
}

.startCard p{
  color:#a6d8e5;
  line-height:1.6;
  font-size:12px;
}

#startGame{
  margin-top:12px;
  width:100%;
  min-height:50px;
}

#message{
  position:fixed;
  left:50%;
  top:70%;
  transform:translate(-50%,-50%);
  z-index:50;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  letter-spacing:4px;
  opacity:0;
  pointer-events:none;
  text-shadow:0 0 18px #00eaff;
}

#message.show{
  animation:message .9s ease forwards;
}

@keyframes message{
  0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}
  25%{opacity:1}
  75%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-60%) scale(1.15)}
}

#status{
  position:fixed;
  top:150px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  font-size:10px;
  letter-spacing:2px;
  opacity:.7;
  pointer-events:none;
  white-space:nowrap;
}

.hidden{
  display:none!important;
}

@media(max-width:500px){
  #header{
    top:10px;
  }

  .brand{
    font-size:16px;
  }

  .hud{
    font-size:9px;
  }

  #mission{
    top:74px;
  }

  #bossName{
    font-size:15px;
  }

  #arena{
    top:50%;
    height:58vh;
  }

  #gesture{
    bottom:78px;
  }

  button{
    padding:9px 12px;
    font-size:10px;
  }
}
</style>
</head>

<body>

<div id="space">
  <div class="stars"></div>
  <div id="grid"></div>
</div>

<video id="camera" autoplay playsinline muted></video>
<canvas id="output"></canvas>

<div id="header">
  <div>
    <div class="brand">SARVESH HOLO</div>
    <div class="sub">GESTURE COMBAT SYSTEM · V15</div>
  </div>

  <div class="hud">
    SCORE <span id="score">000000</span><br>
    ENERGY <span id="energy">100%</span><br>
    LIVES <span id="lives">♥ ♥ ♥</span>
  </div>
</div>

<div id="mission">
  <div class="missionTitle">MISSION // HOLO GUARDIAN</div>
  <div id="bossName">HOLO GUARDIAN</div>
  <div id="bossBar">
    <div id="bossHealth"></div>
  </div>
</div>

<div id="status">SYSTEM READY</div>

<div id="arena">

  <div id="reactor"></div>

  <div id="boss">
    <div class="wing left"></div>
    <div class="wing right"></div>
    <div class="bossCore"></div>
  </div>

  <div id="target"></div>

  <div id="cursor">
    <div id="cursorPinch"></div>
  </div>

  <div id="beam"></div>

</div>

<div id="gesture">WAITING FOR HAND</div>

<div id="message"></div>

<div id="controls">
  <button id="startBtn" class="primary">START CAMERA</button>
  <button id="stopBtn">STOP</button>
  <button id="pauseBtn">PAUSE</button>
  <button id="resetBtn">RESET</button>
</div>

<div id="startScreen">
  <div class="startCard">
    <h1>SARVESH HOLO</h1>
    <p>
      HOLOGRAM BOSS ARENA<br><br>
      ☝ POINT — AIM<br>
      🤏 PINCH — LOCK / FIRE<br>
      🖐 OPEN PALM — SHIELD<br>
      ✊ FIST — EMERGENCY PAUSE<br>
      🤏🤏 TWO HANDS — CHARGE BEAM
    </p>

    <button id="startGame" class="primary">
      ENTER HOLO ARENA
    </button>
  </div>
</div>

<script>
(() => {

  const video = document.getElementById("camera");
  const canvas = document.getElementById("output");
  const ctx = canvas.getContext("2d");

  const startScreen = document.getElementById("startScreen");
  const startGame = document.getElementById("startGame");

  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const resetBtn = document.getElementById("resetBtn");

  const scoreEl = document.getElementById("score");
  const energyEl = document.getElementById("energy");
  const livesEl = document.getElementById("lives");
  const healthEl = document.getElementById("bossHealth");

  const gestureEl = document.getElementById("gesture");
  const statusEl = document.getElementById("status");

  const arena = document.getElementById("arena");
  const boss = document.getElementById("boss");
  const target = document.getElementById("target");
  const cursor = document.getElementById("cursor");
  const beam = document.getElementById("beam");
  const message = document.getElementById("message");

  let stream = null;
  let hands = null;
  let running = false;
  let paused = false;
  let raf = 0;

  let score = 0;
  let energy = 100;
  let lives = 3;
  let bossHealth = 100;

  let lastShot = 0;
  let lastDamage = 0;
  let targetX = .5;
  let targetY = .5;
  let bossX = .5;
  let bossY = .3;

  let currentGesture = "WAITING";
  let handData = [];

  let twoHandCharge = 0;
  let shieldActive = false;

  function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
  }

  function distance(a,b){
    const dx=a.x-b.x;
    const dy=a.y-b.y;
    return Math.sqrt(dx*dx+dy*dy);
  }

  function showMessage(text){
    message.textContent=text;
    message.classList.remove("show");
    void message.offsetWidth;
    message.classList.add("show");
  }

  function updateHUD(){
    scoreEl.textContent=String(score).padStart(6,"0");
    energyEl.textContent=Math.round(energy)+"%";
    livesEl.textContent=
      "♥ ".repeat(Math.max(0,lives)).trim()+
      (lives<3 ? " ♡".repeat(3-lives) : "");
    healthEl.style.width=clamp(bossHealth,0,100)+"%";
  }

  function resetGame(){
    score=0;
    energy=100;
    lives=3;
    bossHealth=100;

    targetX=.5;
    targetY=.5;
    bossX=.5;
    bossY=.3;

    twoHandCharge=0;
    shieldActive=false;

    target.style.display="none";
    beam.classList.remove("active");

    statusEl.textContent="SYSTEM READY";
    gestureEl.textContent="WAITING FOR HAND";

    updateHUD();
  }

  function spawnTarget(){
    targetX=.22+Math.random()*.56;
    targetY=.18+Math.random()*.58;

    target.style.left=(targetX*100)+"%";
    target.style.top=(targetY*100)+"%";
    target.style.display="block";
  }

  function hideTarget(){
    target.style.display="none";
  }

  function damageBoss(amount){
    bossHealth-=amount;

    if(bossHealth<=0){
      bossHealth=0;
      updateHUD();

      showMessage("BOSS DEFEATED");
      statusEl.textContent="MISSION COMPLETE";

      score+=5000;
      updateHUD();

      setTimeout(() => {
        bossHealth=100;
        score+=1000;
        spawnTarget();
        statusEl.textContent="NEW GUARDIAN DETECTED";
        updateHUD();
      },2500);

      return;
    }

    updateHUD();
  }

  function takeDamage(){
    if(shieldActive)return;

    const now=performance.now();

    if(now-lastDamage<1200)return;

    lastDamage=now;
    lives--;
    energy-=15;

    showMessage("IMPACT");

    if(lives<=0){
      lives=0;
      paused=true;
      statusEl.textContent="SYSTEM FAILURE";
      showMessage("GAME OVER");
    }

    updateHUD();
  }

  function shoot(){
    const now=performance.now();

    if(now-lastShot<500)return;
    if(energy<=5)return;

    lastShot=now;
    energy-=5;

    beam.classList.add("active");

    setTimeout(()=>{
      beam.classList.remove("active");
    },180);

    const dx=targetX-.5;
    const dy=targetY-.5;
    const hitDistance=Math.sqrt(dx*dx+dy*dy);

    if(hitDistance<.22){
      score+=250;
      damageBoss(8);
      hideTarget();
      showMessage("+250");

      setTimeout(()=>{
        if(running && !paused)spawnTarget();
      },500);
    }

    updateHUD();
  }

  function getGesture(lm){

    if(!lm || lm.length<21)return "WAITING";

    const wrist=lm[0];

    const thumb=distance(lm[4],wrist);
    const index=distance(lm[8],wrist);
    const middle=distance(lm[12],wrist);
    const ring=distance(lm[16],wrist);
    const pinky=distance(lm[20],wrist);

    const pinch=distance(lm[4],lm[8]);

    const palm=Math.max(
      .05,
      distance(lm[5],lm[17])
    );

    const pinchRatio=pinch/palm;

    const fingersExtended=
      index>palm*.95 &&
      middle>palm*.95 &&
      ring>palm*.9 &&
      pinky>palm*.75;

    const fist=
      index<palm*.85 &&
      middle<palm*.9 &&
      ring<palm*.85 &&
      pinky<palm*.75;

    if(pinchRatio<.62)return "PINCH";

    if(fist)return "FIST";

    if(fingersExtended)return "OPEN PALM";

    return "POINT";
  }

  function drawHands(results){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(!results.multiHandLandmarks)return;

    for(const lm of results.multiHandLandmarks){

      ctx.lineWidth=2;
      ctx.strokeStyle="rgba(0,220,255,.35)";
      ctx.fillStyle="rgba(0,240,255,.8)";

      const points=lm.map(p=>({
        x:(1-p.x)*canvas.width,
        y:p.y*canvas.height
      }));

      const connections=[
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],
        [5,9],[9,13],[13,17]
      ];

      for(const [a,b] of connections){
        ctx.beginPath();
        ctx.moveTo(points[a].x,points[a].y);
        ctx.lineTo(points[b].x,points[b].y);
        ctx.stroke();
      }

      for(const p of points){
        ctx.beginPath();
        ctx.arc(p.x,p.y,3,0,Math.PI*2);
        ctx.fill();
      }
    }
  }

  function processHands(results){

    handData=results.multiHandLandmarks || [];

    drawHands(results);

    if(!handData.length){
      currentGesture="WAITING";
      gestureEl.textContent="WAITING FOR HAND";
      cursor.style.display="none";
      return;
    }

    const first=handData[0];

    currentGesture=getGesture(first);

    gestureEl.textContent=
      handData.length>1
      ? currentGesture+" · 2 HANDS"
      : currentGesture;

    const index=first[8];

    const screenX=1-index.x;
    const screenY=index.y;

    cursor.style.display="block";
    cursor.style.left=(screenX*100)+"%";
    cursor.style.top=(screenY*100)+"%";

    if(!paused){

      bossX += ((screenX-.5)*.35-bossX)*.04;
      bossY += ((screenY-.5)*.15+.3-bossY)*.04;

      boss.style.left=(bossX*100)+"%";
      boss.style.top=(bossY*100)+"%";

      if(currentGesture==="OPEN PALM"){
        shieldActive=true;
        statusEl.textContent="SHIELD ACTIVE";
        energy=Math.min(100,energy+.12);
      }else{
        shieldActive=false;
      }

      if(currentGesture==="PINCH"){
        statusEl.textContent="TARGET LOCK";

        const dx=screenX-targetX;
        const dy=screenY-targetY;

        if(Math.sqrt(dx*dx+dy*dy)<.18){
          shoot();
        }
      }

      if(currentGesture==="FIST"){
        statusEl.textContent="EMERGENCY PAUSE";
        paused=true;
      }

      if(handData.length>=2){

        const h1=handData[0][9];
        const h2=handData[1][9];

        const d=distance(h1,h2);

        if(
          getGesture(handData[0])==="PINCH" &&
          getGesture(handData[1])==="PINCH"
        ){
          twoHandCharge=clamp(
            twoHandCharge+(d>.22?.8:-.4),
            0,
            100
          );

          statusEl.textContent=
            "DUAL-HAND BEAM · "+Math.round(twoHandCharge)+"%";

          if(twoHandCharge>=100){
            score+=1000;
            damageBoss(20);
            twoHandCharge=0;
            showMessage("POWER BEAM");
          }
        }else{
          twoHandCharge=Math.max(0,twoHandCharge-1);
        }
      }
    }

    updateHUD();
  }

  async function startCamera(){

    if(running)return;

    try{

      stream=await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },
        audio:false
      });

      video.srcObject=stream;
      await video.play();

      running=true;
      paused=false;

      statusEl.textContent="CAMERA ONLINE";
      startBtn.textContent="CAMERA RUNNING";

      if(!hands){

        hands=new Hands({
          locateFile:(file)=>{
            return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+file;
          }
        });

        hands.setOptions({
          maxNumHands:2,
          modelComplexity:1,
          minDetectionConfidence:.6,
          minTrackingConfidence:.6
        });

        hands.onResults(processHands);
      }

      loop();

    }catch(err){

      console.error(err);

      statusEl.textContent="CAMERA ERROR";

      alert(
        "Camera could not start. Please allow camera permission and try again."
      );
    }
  }

  async function loop(){

    if(!running)return;

    if(
      !paused &&
      video.readyState>=2
    ){
      try{
        await hands.send({image:video});
      }catch(err){
        console.warn(err);
      }
    }

    raf=requestAnimationFrame(loop);
  }

  function stopCamera(){

    running=false;

    cancelAnimationFrame(raf);

    if(stream){
      stream.getTracks().forEach(track=>track.stop());
      stream=null;
    }

    video.srcObject=null;

    statusEl.textContent="CAMERA STOPPED";
    startBtn.textContent="START CAMERA";

    cursor.style.display="none";
    beam.classList.remove("active");
  }

  startGame.addEventListener("click",()=>{
    startScreen.classList.add("hidden");
    resetGame();
    startCamera();

    setTimeout(()=>{
      spawnTarget();
    },1200);
  });

  startBtn.addEventListener("click",()=>{
    startCamera();
  });

  stopBtn.addEventListener("click",()=>{
    stopCamera();
  });

  pauseBtn.addEventListener("click",()=>{

    paused=!paused;

    pauseBtn.textContent=paused?"RESUME":"PAUSE";

    statusEl.textContent=
      paused
      ? "SYSTEM PAUSED"
      : "SYSTEM ACTIVE";
  });

  resetBtn.addEventListener("click",()=>{
    paused=false;
    pauseBtn.textContent="PAUSE";
    resetGame();

    if(running){
      spawnTarget();
    }
  });

  window.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){
      paused=!paused;
      pauseBtn.textContent=paused?"RESUME":"PAUSE";
    }

    if(e.key.toLowerCase()==="r"){
      resetGame();
    }
  });

  window.addEventListener("resize",()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
  });

  resetGame();

})();
</script>

</body>
</html>
