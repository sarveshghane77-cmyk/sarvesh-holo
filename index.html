<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SARVESH HOLO V6</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#030712;
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

.app{
  min-height:100vh;
  padding:16px;
}

header{
  max-width:1000px;
  margin:auto;
  padding:16px 0;
  border-bottom:1px solid #1e293b;
}

.logo{
  font-size:23px;
  font-weight:700;
  letter-spacing:2px;
}

.sub{
  margin-top:5px;
  color:#64748b;
  font-size:12px;
  letter-spacing:1px;
}

.status{
  display:inline-block;
  margin-top:10px;
  padding:6px 10px;
  border:1px solid #334155;
  border-radius:20px;
  color:#94a3b8;
  font-size:12px;
}

.lab{
  max-width:1000px;
  margin:18px auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.panel{
  background:#070d18;
  border:1px solid #1e293b;
  border-radius:20px;
  padding:14px;
}

.title{
  margin-bottom:10px;
  color:#cbd5e1;
  font-size:14px;
  font-weight:bold;
}

.camera{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  overflow:hidden;
  border-radius:14px;
  background:#020617;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transform:scaleX(-1);
}

#handCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transform:scaleX(-1);
}

.pointer{
  position:absolute;
  width:18px;
  height:18px;
  border:2px solid white;
  border-radius:50%;
  transform:translate(-50%,-50%);
  display:none;
  pointer-events:none;
  z-index:10;
}

.scene{
  position:relative;
  min-height:340px;
  height:100%;
  overflow:hidden;
  border-radius:14px;

  background:
    radial-gradient(
      circle at center,
      rgba(59,130,246,.14),
      transparent 38%
    ),
    #020617;

  perspective:900px;
  perspective-origin:center center;
}

.grid{
  position:absolute;
  width:160%;
  height:70%;
  left:-30%;
  bottom:-20%;

  background:
    linear-gradient(
      rgba(30,58,95,.8) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(30,58,95,.8) 1px,
      transparent 1px
    );

  background-size:30px 30px;

  transform:
    perspective(160px)
    rotateX(60deg);

  opacity:.35;
}


/*
================================================
3D CUBE SYSTEM
================================================
*/

.cube{
  position:absolute;

  left:50%;
  top:50%;

  width:110px;
  height:110px;

  transform-style:preserve-3d;

  transform:
    translate3d(-50%,-50%,0)
    rotateX(0deg)
    rotateY(0deg)
    rotateZ(0deg)
    scale3d(1,1,1);

  will-change:
    left,
    top,
    transform;

  transition:
    opacity .18s ease;
}


/*
Each cube has six real 3D faces.
*/

.face{
  position:absolute;

  width:110px;
  height:110px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid #60a5fa;

  background:
    rgba(59,130,246,.07);

  color:#93c5fd;

  font-size:10px;

  box-shadow:
    inset 0 0 20px rgba(59,130,246,.06),
    0 0 18px rgba(59,130,246,.15);
}

.front{
  transform:
    translateZ(55px);
}

.back{
  transform:
    rotateY(180deg)
    translateZ(55px);
}

.right{
  transform:
    rotateY(90deg)
    translateZ(55px);
}

.left{
  transform:
    rotateY(-90deg)
    translateZ(55px);
}

.top{
  transform:
    rotateX(90deg)
    translateZ(55px);
}

.bottom{
  transform:
    rotateX(-90deg)
    translateZ(55px);
}


/*
================================================
SECOND CUBE
================================================
*/

#cube2{
  display:none;
}


/*
================================================
CONTROLS
================================================
*/

.controls{
  max-width:1000px;
  margin:auto;

  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  padding:13px 18px;

  border:1px solid #334155;
  border-radius:12px;

  background:#0f172a;
  color:#e2e8f0;

  font-size:14px;
}

button:active{
  transform:scale(.98);
}

.info{
  max-width:1000px;
  margin:14px auto;

  padding:14px;

  border:1px solid #1e293b;
  border-radius:14px;

  background:#070d18;

  color:#94a3b8;

  font-size:13px;
  line-height:1.6;
}

@media(max-width:700px){

  .lab{
    grid-template-columns:1fr;
  }

  .scene{
    min-height:300px;
  }

}

</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>


<script>

/*
==================================================
ELEMENTS
==================================================
*/

const video =
document.getElementById("video");

const canvas =
document.getElementById("handCanvas");

const ctx =
canvas.getContext("2d");

const cube1 =
document.getElementById("cube1");

const cube2 =
document.getElementById("cube2");

const pointer =
document.getElementById("pointer");

const status =
document.getElementById("status");

const info =
document.getElementById("info");

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");

const resetButton =
document.getElementById("reset");


/*
==================================================
SYSTEM
==================================================
*/

let stream = null;

let running = false;

let hands = null;

let animationFrame = null;


/*
==================================================
SINGLE CUBE STATE
==================================================
*/

let single = {

  x:50,
  y:50,

  targetX:50,
  targetY:50,

  rx:0,
  ry:0,
  rz:0,

  targetRX:0,
  targetRY:0,
  targetRZ:0,

  scale:1,
  targetScale:1

};


/*
==================================================
TWO CUBE STATE
==================================================
*/

let dual = {

  active:false,

  cube1:{
    x:35,
    y:50,
    targetX:35,
    targetY:50,

    rx:0,
    ry:0,
    rz:0,

    targetRX:0,
    targetRY:0,
    targetRZ:0,

    scale:.5,
    targetScale:.5
  },

  cube2:{
    x:65,
    y:50,
    targetX:65,
    targetY:50,

    rx:0,
    ry:0,
    rz:0,

    targetRX:0,
    targetRY:0,
    targetRZ:0,

    scale:.5,
    targetScale:.5
  }

};


/*
==================================================
SMOOTHING
==================================================
*/

const POSITION_SMOOTHING =
0.20;

const ROTATION_SMOOTHING =
0.16;

const SCALE_SMOOTHING =
0.14;


/*
==================================================
BASIC MATH
==================================================
*/

function distance(a,b){

  const dx =
    a.x-b.x;

  const dy =
    a.y-b.y;

  const dz =
    (a.z || 0) -
    (b.z || 0);

  return Math.sqrt(
    dx*dx +
    dy*dy +
    dz*dz
  );

}


function subtract(a,b){

  return {
    x:a.x-b.x,
    y:a.y-b.y,
    z:(a.z||0)-(b.z||0)
  };

}


function length(v){

  return Math.sqrt(
    v.x*v.x +
    v.y*v.y +
    v.z*v.z
  );

}


function normalize(v){

  const l =
    Math.max(
      length(v),
      .0001
    );

  return {
    x:v.x/l,
    y:v.y/l,
    z:v.z/l
  };

}


function cross(a,b){

  return {

    x:
      a.y*b.z -
      a.z*b.y,

    y:
      a.z*b.x -
      a.x*b.z,

    z:
      a.x*b.y -
      a.y*b.x

  };

}


/*
==================================================
PINCH DETECTION
==================================================
*/

function isPinching(p){

  const thumb =
    p[4];

  const index =
    p[8];

  const wrist =
    p[0];

  const middle =
    p[9];

  const palmSize =
    Math.max(
      distance(
        wrist,
        middle
      ),
      .001
    );


  const pinchDistance =
    distance(
      thumb,
      index
    );


  /*
  Relative threshold makes
  pinch work at different
  hand distances.
  */

  return (
    pinchDistance /
    palmSize
  ) < .42;

}


/*
==================================================
PALM DATA
==================================================
*/

function getPalmData(p){

  const wrist =
    p[0];

  const indexMCP =
    p[5];

  const middleMCP =
    p[9];

  const ringMCP =
    p[13];

  const pinkyMCP =
    p[17];


  /*
  Palm center
  */

  const palmX =
    (
      wrist.x +
      indexMCP.x +
      middleMCP.x +
      ringMCP.x +
      pinkyMCP.x
    ) / 5;


  const palmY =
    (
      wrist.y +
      indexMCP.y +
      middleMCP.y +
      ringMCP.y +
      pinkyMCP.y
    ) / 5;


  /*
  Camera mirror
  */

  const screenX =
    1-palmX;


  const screenY =
    palmY;


  /*
  Palm orientation
  */

  const across =
    normalize(
      subtract(
        pinkyMCP,
        indexMCP
      )
    );


  const up =
    normalize(
      subtract(
        middleMCP,
        wrist
      )
    );


  const normal =
    normalize(
      cross(
        across,
        up
      )
    );


  /*
  Roll
  */

  const roll =
    Math.atan2(
      across.y,
      across.x
    ) *
    180 /
    Math.PI;


  /*
  Yaw
  */

  const yaw =
    Math.atan2(
      normal.x,
      Math.max(
        Math.abs(normal.z),
        .001
      )
    ) *
    180 /
    Math.PI;


  /*
  Pitch
  */

  const pitch =
    Math.atan2(
      normal.y,
      Math.max(
        Math.abs(normal.z),
        .001
      )
    ) *
    180 /
    Math.PI;


  /*
  Palm size/depth
  */

  const palmWidth =
    distance(
      indexMCP,
      pinkyMCP
    );


  let scale =
    .65 +
    palmWidth*5;


  scale =
    Math.max(
      .65,
      Math.min(
        1.8,
        scale
      )
    );


  return {

    x:
      Math.max(
        8,
        Math.min(
          92,
          screenX*100
        )
      ),

    y:
      Math.max(
        8,
        Math.min(
          92,
          screenY*100
        )
      ),

    rx:
      Math.max(
        -70,
        Math.min(
          70,
          pitch*1.2
        )
      ),

    ry:
      Math.max(
        -80,
        Math.min(
          80,
          yaw*1.4
        )
      ),

    rz:
      Math.max(
        -90,
        Math.min(
          90,
          -roll
        )
      ),

    scale:scale

  };

}


/*
==================================================
START CAMERA
==================================================
*/

async function startCamera(){

  if(running){
    return;
  }


  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera API unavailable."
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",

          width:{
            ideal:640
          },

          height:{
            ideal:480
          }

        },

        audio:false

      });


    video.srcObject =
      stream;

    running =
      true;


    status.textContent =
      "● LOADING HAND TRACKING";


    info.innerHTML =
      "Camera started.<br>" +
      "Initializing multi-hand 3D control...";


    await video.play();


    setupHands();

    processCamera();

    animate();

  }

  catch(error){

    console.error(error);

    status.textContent =
      "● CAMERA ERROR";

    info.innerHTML =
      error.name +
      ": " +
      error.message;

  }

}


/*
==================================================
MEDIAPIPE
==================================================
*/

function setupHands(){

  if(hands){
    return;
  }


  hands =
    new Hands({

      locateFile:function(file){

        return (
          "https://cdn.jsdelivr.net/npm/" +
          "@mediapipe/hands/" +
          file
        );

      }

    });


  hands.setOptions({

    /*
    IMPORTANT:
    V6 needs two hands.
    */

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:.6,

    minTrackingConfidence:.6

  });


  hands.onResults(
    onResults
  );

}


/*
==================================================
PROCESS
==================================================
*/

async function processCamera(){

  if(!running){
    return;
  }


  if(video.readyState>=2){

    try{

      await hands.send({
        image:video
      });

    }

    catch(error){

      console.error(
        "Tracking error:",
        error
      );

    }

  }


  requestAnimationFrame(
    processCamera
  );

}


/*
==================================================
RESULTS
==================================================
*/

function onResults(results){

  if(!running){
    return;
  }


  const width =
    video.videoWidth ||
    640;

  const height =
    video.videoHeight ||
    480;


  canvas.width =
    width;

  canvas.height =
    height;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  const detected =
    results.multiHandLandmarks || [];


  /*
  ================================================
  NO HAND
  ================================================
  */

  if(detected.length===0){

    status.textContent =
      "● SEARCHING FOR HANDS";

    info.innerHTML =
      "Show one or two hands.";

    pointer.style.display =
      "none";

    return;

  }


  /*
  ================================================
  DRAW HANDS
  ================================================
  */

  detected.forEach(
    landmarks => {

      drawConnectors(
        ctx,
        landmarks,
        HAND_CONNECTIONS,
        {
          color:"#60a5fa",
          lineWidth:3
        }
      );


      drawLandmarks(
        ctx,
        landmarks,
        {
          color:"#ffffff",
          lineWidth:1,
          radius:4
        }
      );

    }
  );


  /*
  ================================================
  ONE HAND
  ================================================
  */

  if(detected.length===1){

    /*
    If dual mode was previously active,
    reset back to one cube.
    */

    if(dual.active){

      mergeCubes();

    }


    const palm =
      getPalmData(
        detected[0]
      );


    single.targetX =
      palm.x;

    single.targetY =
      palm.y;


    single.targetRX =
      palm.rx;

    single.targetRY =
      palm.ry;

    single.targetRZ =
      palm.rz;

    single.targetScale =
      palm.scale;


    status.textContent =
      "● ONE-HAND 3D CONTROL";


    info.innerHTML =
      "✋ One hand detected.<br>" +
      "Move, rotate and tilt your palm to control the 3D cube.";

    return;

  }


  /*
  ================================================
  TWO HANDS
  ================================================
  */

  const palmA =
    getPalmData(
      detected[0]
    );

  const palmB =
    getPalmData(
      detected[1]
    );


  const pinchA =
    isPinching(
      detected[0]
    );

  const pinchB =
    isPinching(
      detected[1]
    );


  /*
  ================================================
  TWO HANDS BUT NO DOUBLE PINCH
  ================================================
  */

  if(
    !(pinchA && pinchB)
  ){

    /*
    IMPORTANT:
    Two hands alone do NOT
    change the cube.
    */

    status.textContent =
      "● TWO HANDS DETECTED · WAITING";


    info.innerHTML =
      "Two hands detected.<br>" +
      "Nothing changes until you pinch with BOTH hands.";

    return;

  }


  /*
  ================================================
  BOTH HANDS PINCHING
  ================================================
  */

  status.textContent =
    "● BOTH HANDS PINCHING";


  info.innerHTML =
    "🤏 Both hands pinching.<br>" +
    "Move your hands apart to split the 3D cube.";


  /*
  ================================================
  DISTANCE BETWEEN HANDS
  ================================================
  */

  const dx =
    palmA.x -
    palmB.x;

  const dy =
    palmA.y -
    palmB.y;


  const handDistance =
    Math.sqrt(
      dx*dx +
      dy*dy
    );


  /*
  ================================================
  SPLIT TRIGGER
  ================================================
  */

  /*
  Around 18% screen distance:
  begin split.

  Above 25%:
  clearly split.
  */

  if(
    !dual.active &&
    handDistance > 18
  ){

    splitCubes();

  }


  /*
  ================================================
  IF DUAL MODE
  ================================================
  */

  if(dual.active){

    /*
    Merge when pinched hands
    become close again.
    */

    if(
      handDistance < 14
    ){

      mergeCubes();

      return;

    }


    /*
    ============================================
    CUBE 1 FOLLOWS HAND 1
    ============================================
    */

    dual.cube1.targetX =
      palmA.x;

    dual.cube1.targetY =
      palmA.y;


    dual.cube1.targetRX =
      palmA.rx;

    dual.cube1.targetRY =
      palmA.ry;

    dual.cube1.targetRZ =
      palmA.rz;


    /*
    HALF SIZE
    */

    dual.cube1.targetScale =
      .5;


    /*
    ============================================
    CUBE 2 FOLLOWS HAND 2
    ============================================
    */

    dual.cube2.targetX =
      palmB.x;

    dual.cube2.targetY =
      palmB.y;


    dual.cube2.targetRX =
      palmB.rx;

    dual.cube2.targetRY =
      palmB.ry;

    dual.cube2.targetRZ =
      palmB.rz;


    /*
    HALF SIZE
    */

    dual.cube2.targetScale =
      .5;


    info.innerHTML =
      "🤏🤏 DUAL 3D CONTROL ACTIVE.<br>" +
      "Each pinched hand controls one half-size cube.<br>" +
      "Bring them closer together to merge.";

  }

}


/*
==================================================
SPLIT
==================================================
*/

function splitCubes(){

  dual.active =
    true;


  /*
  Hide original
  */

  cube1.style.display =
    "none";


  /*
  Show second cube
  */

  cube2.style.display =
    "block";


  /*
  Start two cubes from
  the current single cube.
  */

  const baseX =
    single.x;

  const baseY =
    single.y;


  dual.cube1.x =
    baseX-5;

  dual.cube1.y =
    baseY;


  dual.cube1.targetX =
    baseX-5;

  dual.cube1.targetY =
    baseY;


  dual.cube1.rx =
    single.rx;

  dual.cube1.ry =
    single.ry;

  dual.cube1.rz =
    single.rz;


  dual.cube1.targetRX =
    single.rx;

  dual.cube1.targetRY =
    single.ry;

  dual.cube1.targetRZ =
    single.rz;


  dual.cube1.scale =
    .5;

  dual.cube1.targetScale =
    .5;


  /*
  Cube 2
  */

  dual.cube2.x =
    baseX+5;

  dual.cube2.y =
    baseY;


  dual.cube2.targetX =
    baseX+5;

  dual.cube2.targetY =
    baseY;


  dual.cube2.rx =
    single.rx;

  dual.cube2.ry =
    single.ry;

  dual.cube2.rz =
    single.rz;


  dual.cube2.targetRX =
    single.rx;

  dual.cube2.targetRY =
    single.ry;

  dual.cube2.targetRZ =
    single.rz;


  dual.cube2.scale =
    .5;

  dual.cube2.targetScale =
    .5;


  status.textContent =
    "● 3D CORE SPLIT";

}


/*
==================================================
MERGE
==================================================
*/

function mergeCubes(){

  if(!dual.active){
    return;
  }


  dual.active =
    false;


  /*
  Hide second cube
  */

  cube2.style.display =
    "none";


  /*
  Show original cube
  */

  cube1.style.display =
    "block";


  /*
  Calculate center between
  the two cubes.
  */

  single.targetX =
    (
      dual.cube1.x +
      dual.cube2.x
    ) / 2;


  single.targetY =
    (
      dual.cube1.y +
      dual.cube2.y
    ) / 2;


  /*
  Use average orientation.
  */

  single.targetRX =
    (
      dual.cube1.rx +
      dual.cube2.rx
    ) / 2;


  single.targetRY =
    (
      dual.cube1.ry +
      dual.cube2.ry
    ) / 2;


  single.targetRZ =
    (
      dual.cube1.rz +
      dual.cube2.rz
    ) / 2;


  /*
  Return to full size.
  */

  single.targetScale =
    1;


  status.textContent =
    "● 3D CORES MERGING";


  info.innerHTML =
    "🤏🤏 Hands brought together.<br>" +
    "Two 3D cubes are merging into one.";

}


/*
==================================================
SMOOTH OBJECT
==================================================
*/

function smoothObject(obj){

  obj.x +=
    (
      obj.targetX -
      obj.x
    ) *
    POSITION_SMOOTHING;


  obj.y +=
    (
      obj.targetY -
      obj.y
    ) *
    POSITION_SMOOTHING;


  obj.rx +=
    (
      obj.targetRX -
      obj.rx
    ) *
    ROTATION_SMOOTHING;


  obj.ry +=
    (
      obj.targetRY -
      obj.ry
    ) *
    ROTATION_SMOOTHING;


  obj.rz +=
    (
      obj.targetRZ -
      obj.rz
    ) *
    ROTATION_SMOOTHING;


  obj.scale +=
    (
      obj.targetScale -
      obj.scale
    ) *
    SCALE_SMOOTHING;

}


/*
==================================================
RENDER CUBE
==================================================
*/

function renderCube(element,obj){

  element.style.left =
    obj.x + "%";


  element.style.top =
    obj.y + "%";


  element.style.transform =
    "translate3d(-50%,-50%,0)" +

    " rotateX(" +
    obj.rx +
    "deg)" +

    " rotateY(" +
    obj.ry +
    "deg)" +

    " rotateZ(" +
    obj.rz +
    "deg)" +

    " scale3d(" +
    obj.scale +
    "," +
    obj.scale +
    "," +
    obj.scale +
    ")";

}


/*
==================================================
ANIMATION
==================================================
*/

function animate(){

  if(!running){
    return;
  }


  if(dual.active){

    smoothObject(
      dual.cube1
    );

    smoothObject(
      dual.cube2
    );


    renderCube(
      cube1,
      dual.cube1
    );


    renderCube(
      cube2,
      dual.cube2
    );

  }

  else{

    smoothObject(
      single
    );


    renderCube(
      cube1,
      single
    );

  }


  animationFrame =
    requestAnimationFrame(
      animate
    );

}


/*
==================================================
STOP
==================================================
*/

function stopCamera(){

  running =
    false;


  if(animationFrame){

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame =
      null;

  }


  if(stream){

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    stream =
      null;

  }


  video.srcObject =
    null;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  pointer.style.display =
    "none";


  cube2.style.display =
    "none";


  cube1.style.display =
    "block";


  dual.active =
    false;


  status.textContent =
    "● CAMERA OFF";


  info.innerHTML =
    "Camera stopped.<br>" +
    "Tap START CAMERA to begin.";

}


/*
==================================================
RESET
==================================================
*/

function resetHologram(){

  dual.active =
    false;


  cube2.style.display =
    "none";

  cube1.style.display =
    "block";


  single.x =
    50;

  single.y =
    50;

  single.targetX =
    50;

  single.targetY =
    50;


  single.rx =
    0;

  single.ry =
    0;

  single.rz =
    0;


  single.targetRX =
    0;

  single.targetRY =
    0;

  single.targetRZ =
    0;


  single.scale =
    1;

  single.targetScale =
    1;


  status.textContent =
    running
      ? "● 3D SYSTEM READY"
      : "● SYSTEM READY";


  info.innerHTML =
    "3D cube reset.<br>" +
    "Ready for one-hand or two-hand control.";

}


/*
==================================================
BUTTONS
==================================================
*/

startButton.addEventListener(
  "click",
  startCamera
);

stopButton.addEventListener(
  "click",
  stopCamera
);

resetButton.addEventListener(
  "click",
  resetHologram
);

</script>
